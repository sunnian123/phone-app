name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential ccache automake libssl-dev libffi-dev autoconf libtool libltdl-dev pkg-config cmake libstdc++6 libgl1-mesa-dev zlib1g-dev
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          ln -s $ANDROID_HOME/cmdline-tools/latest $ANDROID_HOME/tools
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"
      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee buildozer.log
          echo "BUILD_EXIT_CODE=$?" >> $GITHUB_ENV
        timeout-minutes: 60
        continue-on-error: true
      - name: Show build errors
        if: always()
        run: |
          echo "=== Last 200 lines of buildozer.log ==="
          tail -200 buildozer.log
          echo "=== Searching for errors ==="
          grep -i -E "error:|fatal|undefined reference|cannot find|No such file|exception|Buildozer failed" buildozer.log | tail -50 || true
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: buildozer.log
      - name: Find APK
        if: always()
        run: |
          echo "=== First 100 lines of buildozer.log ==="
          head -100 buildozer.log
          echo "=== Last 100 lines of buildozer.log ==="
          tail -100 buildozer.log
          echo "=== bin directory ==="
          ls -la bin/ 2>/dev/null || echo "No bin directory"
          echo "=== Current directory ==="
          pwd
          ls -la
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-app
          path: "**/*.apk"
